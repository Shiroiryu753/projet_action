  labels:
    app: heh-flask
spec:
  replicas: 1
  selector:
    matchLabels:
      app: heh-flask
  template:
    metadata:
      labels:
        app: heh-flask
    spec:
      containers:
        - name: heh-flask
          image: shiroiryu/heh-flask:6d318eb6369f7dd19b6f3f677e7f48cb34567936
          imagePullPolicy: IfNotPresent


