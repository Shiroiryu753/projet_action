apiVersion: apps/v1
kind: Deployment
metadata:
  name: heh-flask
  labels:
    app: heh-flask
spec:
  replicas: 1
  selector:
    matchLabels:
      app: heh-flask
  template:
    metadata:
      labels:
        app: heh-flask
    spec:
      containers:
        - name: heh-flask
          image: shiroiryu/heh-flask:68496f490dd719aea880958ed69e3674d4d48cc8
          imagePullPolicy: IfNotPresent


